# Catálogo (Equipe 2): 3 serviços independentes, cada um na sua porta.
# Restaurantes e Cardápio têm cada um o seu banco (database per service); a Busca não tem banco.
# Subir tudo (inclusive o front): docker compose up -d --build
name: catalogo

x-app: &app
  build: &build
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  healthcheck: &app-healthcheck
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 40s

# Origens que podem chamar as APIs pelo navegador (CORS): front local (npm run dev) e o contêiner do front.
x-cors-env: &cors-env
  CATALOGO_CORS_ORIGENS_PERMITIDAS: ${CATALOGO_CORS_ORIGENS_PERMITIDAS:-http://localhost:5173,http://localhost:${FRONTEND_PORT:-3000}}

x-db-healthcheck: &db-healthcheck
  interval: 5s
  timeout: 5s
  retries: 10

services:
  db-restaurantes:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: restaurantes
      POSTGRES_USER: ${RESTAURANTES_DB_USERNAME:-catalogo}
      POSTGRES_PASSWORD: ${RESTAURANTES_DB_PASSWORD:-catalogo}
    ports:
      - "${RESTAURANTES_DB_PORT:-5433}:5432"
    volumes:
      - restaurantes-data:/var/lib/postgresql/data
    healthcheck:
      <<: *db-healthcheck
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d restaurantes"]

  db-cardapio:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cardapio
      POSTGRES_USER: ${CARDAPIO_DB_USERNAME:-catalogo}
      POSTGRES_PASSWORD: ${CARDAPIO_DB_PASSWORD:-catalogo}
    ports:
      - "${CARDAPIO_DB_PORT:-5434}:5432"
    volumes:
      - cardapio-data:/var/lib/postgresql/data
    healthcheck:
      <<: *db-healthcheck
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d cardapio"]

  restaurantes:
    <<: *app
    build:
      <<: *build
      args:
        SERVICE: restaurantes-service
    environment:
      <<: *cors-env
      SERVER_PORT: 8004
      RESTAURANTES_DB_URL: ${RESTAURANTES_DB_URL:-jdbc:postgresql://db-restaurantes:5432/restaurantes}
      RESTAURANTES_DB_USERNAME: ${RESTAURANTES_DB_USERNAME:-catalogo}
      RESTAURANTES_DB_PASSWORD: ${RESTAURANTES_DB_PASSWORD:-catalogo}
      CARDAPIO_URL: http://cardapio:8005
    ports:
      - "${RESTAURANTES_PORT:-8004}:8004"
    depends_on:
      db-restaurantes:
        condition: service_healthy
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8004/actuator/health"]

  cardapio:
    <<: *app
    build:
      <<: *build
      args:
        SERVICE: cardapio-service
    environment:
      <<: *cors-env
      SERVER_PORT: 8005
      CARDAPIO_DB_URL: ${CARDAPIO_DB_URL:-jdbc:postgresql://db-cardapio:5432/cardapio}
      CARDAPIO_DB_USERNAME: ${CARDAPIO_DB_USERNAME:-catalogo}
      CARDAPIO_DB_PASSWORD: ${CARDAPIO_DB_PASSWORD:-catalogo}
      RESTAURANTES_URL: http://restaurantes:8004
    ports:
      - "${CARDAPIO_PORT:-8005}:8005"
    # Depende só do próprio banco: se Restaurantes cair, o Cardápio continua no ar
    depends_on:
      db-cardapio:
        condition: service_healthy
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8005/actuator/health"]

  busca:
    <<: *app
    build:
      <<: *build
      args:
        SERVICE: busca-service
    environment:
      <<: *cors-env
      SERVER_PORT: 8006
      RESTAURANTES_URL: http://restaurantes:8004
      CARDAPIO_URL: http://cardapio:8005
    ports:
      - "${BUSCA_PORT:-8006}:8006"
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8006/actuator/health"]

  frontend:
    build:
      context: ./frontend
      # As VITE_* são gravadas no build e usadas pelo NAVEGADOR: por isso apontam para
      # localhost com as portas publicadas, e não para os nomes internos (restaurantes:8004).
      args:
        VITE_API_RESTAURANTES_URL: http://localhost:${RESTAURANTES_PORT:-8004}
        VITE_API_CARDAPIO_URL: http://localhost:${CARDAPIO_PORT:-8005}
        VITE_API_BUSCA_URL: http://localhost:${BUSCA_PORT:-8006}
        VITE_API_IDENTIDADE_URL: ${VITE_API_IDENTIDADE_URL:-http://127.0.0.1:18001}
        VITE_IDENTIDADE_CLIENT_ID: ${VITE_IDENTIDADE_CLIENT_ID:-}
        VITE_IDENTIDADE_REDIRECT_URI: ${VITE_IDENTIDADE_REDIRECT_URI:-http://localhost:3000/oauth/callback}
        VITE_IDENTIDADE_SCOPES: ${VITE_IDENTIDADE_SCOPES:-}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      restaurantes:
        condition: service_healthy
      cardapio:
        condition: service_healthy
      busca:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  seed:
    image: python:3.13-alpine
    restart: "no"
    volumes:
      - ./scripts/seed.py:/app/seed.py:ro
    environment:
      RESTAURANTES_URL: http://restaurantes:8004
      CARDAPIO_URL: http://cardapio:8005
      RESTAURANTES_DB_URL: ${RESTAURANTES_DB_URL:-jdbc:postgresql://db-restaurantes:5432/restaurantes}
      CARDAPIO_DB_URL: ${CARDAPIO_DB_URL:-jdbc:postgresql://db-cardapio:5432/cardapio}
      SEED_ENABLED: ${SEED_ENABLED:-true}
      SEED_ALLOW_EXTERNAL: ${SEED_ALLOW_EXTERNAL:-false}
    command: ["python", "/app/seed.py"]
    depends_on:
      restaurantes:
        condition: service_healthy
      cardapio:
        condition: service_healthy

volumes:
  restaurantes-data:
  cardapio-data:
