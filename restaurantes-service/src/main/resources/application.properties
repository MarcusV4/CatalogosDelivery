spring.application.name=restaurantes-service
server.port=${SERVER_PORT:8004}

# Banco exclusivo do serviço de Restaurantes (database per service)
spring.datasource.url=${RESTAURANTES_DB_URL:jdbc:postgresql://localhost:5433/restaurantes}
spring.datasource.username=${RESTAURANTES_DB_USERNAME:catalogo}
spring.datasource.password=${RESTAURANTES_DB_PASSWORD:catalogo}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Outros serviços chamados via HTTP
catalogo.servicos.cardapio.url=${CARDAPIO_URL:http://localhost:8005}
catalogo.servicos.timeout=${SERVICOS_TIMEOUT:3s}

management.endpoints.web.exposure.include=health
