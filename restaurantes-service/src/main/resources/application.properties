spring.application.name=restaurantes-service
server.port=${SERVER_PORT:8004}

# Banco exclusivo do serviço de Restaurantes (database per service)
spring.datasource.url=${RESTAURANTES_DB_URL:jdbc:postgresql://localhost:5433/restaurantes}
spring.datasource.username=${RESTAURANTES_DB_USERNAME:catalogo}
spring.datasource.password=${RESTAURANTES_DB_PASSWORD:catalogo}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.jackson.datatype.datetime.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.deserialization.accept-float-as-int=false

# Horários locais de funcionamento e futuro cálculo de "aberto agora".
catalogo.horarios.zone-id=America/Recife

management.endpoints.web.exposure.include=health

# Identidade (Equipe 1): valida o JWT das rotas de escrita (POST/PUT/PATCH/DELETE).
# No perfil dev (usado pelo Compose) entra um mock local no lugar da chamada HTTP.
catalogo.identidade.url=${IDENTIDADE_URL:http://localhost:8001}
catalogo.identidade.caminho-validacao=${IDENTIDADE_CAMINHO_VALIDACAO:/api/auth/validar}
catalogo.identidade.timeout=${IDENTIDADE_TIMEOUT:3s}
# Perfis (claim role) que podem cadastrar restaurante, separados por vírgula.
catalogo.identidade.roles-cadastro-restaurante=${IDENTIDADE_ROLES_CADASTRO_RESTAURANTE:LOJISTA}
