spring.application.name=restaurantes-service
server.port=${SERVER_PORT:8004}

# Banco exclusivo do serviço de Restaurantes (database per service)
spring.datasource.url=${RESTAURANTES_DB_URL:jdbc:postgresql://localhost:5433/restaurantes}
spring.datasource.username=${RESTAURANTES_DB_USERNAME:catalogo}
spring.datasource.password=${RESTAURANTES_DB_PASSWORD:catalogo}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.jackson.datatype.datetime.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.deserialization.accept-float-as-int=false

# Horários locais de funcionamento e futuro cálculo de "aberto agora".
catalogo.horarios.zone-id=America/Recife

management.endpoints.web.exposure.include=health

# Integração com a Identidade (contrato OAuth da Equipe 1). As escritas exigem
# Authorization: Bearer <access token>; as leituras continuam públicas.
# - modo: identidade (valida de verdade) ou mock (aceita token sem assinatura; só dev local)
# - emissor: valor exato da claim iss
# - jwks-uri: chaves públicas; vazio usa <emissor>/.well-known/jwks.json
# - audiencias: valores aceitos na claim aud (separados por vírgula); sem eles, escritas dão 503
# - rbac-url: base do serviço de Autorização/RBAC (POST /v1/tokens/validar); sem ela, escritas dão 503
catalogo.identidade.modo=${CATALOGO_IDENTIDADE_MODO:identidade}
catalogo.identidade.emissor=${CATALOGO_IDENTIDADE_EMISSOR:http://127.0.0.1:18001}
catalogo.identidade.jwks-uri=${CATALOGO_IDENTIDADE_JWKS_URI:}
catalogo.identidade.audiencias=${CATALOGO_IDENTIDADE_AUDIENCIAS:}
catalogo.identidade.rbac-url=${CATALOGO_IDENTIDADE_RBAC_URL:}
catalogo.identidade.validacao-online=${CATALOGO_IDENTIDADE_VALIDACAO_ONLINE:true}
