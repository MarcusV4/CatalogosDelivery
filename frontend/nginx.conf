server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Usado pelo healthcheck do Compose
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Arquivos com hash no nome: podem ficar em cache por muito tempo
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: rotas do React Router (/login, /qualquer-coisa) caem no index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
