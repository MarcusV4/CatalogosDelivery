spring.application.name=cardapio-service
server.port=${SERVER_PORT:8005}

# Banco exclusivo do serviço de Cardápio (database per service)
spring.datasource.url=${CARDAPIO_DB_URL:jdbc:postgresql://localhost:5434/cardapio}
spring.datasource.username=${CARDAPIO_DB_USERNAME:catalogo}
spring.datasource.password=${CARDAPIO_DB_PASSWORD:catalogo}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Outros serviços consultados via HTTP
catalogo.servicos.restaurantes.url=${RESTAURANTES_URL:http://localhost:8004}
catalogo.servicos.timeout=${SERVICOS_TIMEOUT:3s}

management.endpoints.web.exposure.include=health
