spring.application.name=cardapio-service
server.port=${SERVER_PORT:8005}

# Banco exclusivo do serviço de Cardápio (database per service)
spring.datasource.url=${CARDAPIO_DB_URL:jdbc:postgresql://localhost:5434/cardapio}
spring.datasource.username=${CARDAPIO_DB_USERNAME:catalogo}
spring.datasource.password=${CARDAPIO_DB_PASSWORD:catalogo}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Migrações de banco (Flyway roda antes do Hibernate)
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.jackson.datatype.datetime.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.deserialization.accept-float-as-int=false

# Outros serviços consultados via HTTP
catalogo.servicos.restaurantes.url=${RESTAURANTES_URL:http://localhost:8004}
catalogo.servicos.timeout=${SERVICOS_TIMEOUT:3s}

management.endpoints.web.exposure.include=health

# Identidade (Equipe 1): valida o JWT das rotas de escrita (POST/PUT/PATCH/DELETE).
# No perfil dev (usado pelo Compose) entra um mock local no lugar da chamada HTTP.
catalogo.identidade.url=${IDENTIDADE_URL:http://localhost:8001}
catalogo.identidade.caminho-validacao=${IDENTIDADE_CAMINHO_VALIDACAO:/api/auth/validar}
catalogo.identidade.timeout=${IDENTIDADE_TIMEOUT:3s}
